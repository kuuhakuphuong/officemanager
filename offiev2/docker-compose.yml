# ==============================================================================
# Docker Compose: cum day du - Web + MySQL (trung tam + 2 site phan tan) + MongoDB
# Chay: cp .env.docker .env   (doi mat khau truoc khi chay that)
#       docker compose up -d --build
# ==============================================================================
services:
  # 1. MySQL trung tam: QLToaNha_BCNF (18 bang, seed, trigger, TV4) + QLToaNha_Site1 (TN01)
  mysql-central:
    image: mysql:8.0.40
    container_name: office_mysql_central
    restart: unless-stopped
    command: ["--character-set-server=utf8mb4", "--collation-server=utf8mb4_0900_as_ci"] 
    environment:
      - MYSQL_ROOT_PASSWORD=${MYSQL_ROOT_PASSWORD:?Dat MYSQL_ROOT_PASSWORD trong .env}
    ports:
      - "${DB_PORT:-3306}:3306"
    volumes:
      - mysql_central_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uroot", "-p${MYSQL_ROOT_PASSWORD}", "--silent"]
      interval: 10s
      timeout: 5s
      retries: 15
      start_period: 30s

  # 2. MySQL site 2 (chi nhanh 2 - TN02): may chu rieng
  mysql-site2:
    image: mysql:8.0.40
    container_name: office_mysql_site2
    restart: unless-stopped
    command: ["--character-set-server=utf8mb4", "--collation-server=utf8mb4_0900_as_ci"] 
    environment:
      - MYSQL_ROOT_PASSWORD=${MYSQL_ROOT_PASSWORD:?Dat MYSQL_ROOT_PASSWORD trong .env}
    ports:
      - "${SITE2_DB_PORT:-3307}:3306"
    volumes:
      - mysql_site2_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uroot", "-p${MYSQL_ROOT_PASSWORD}", "--silent"]
      interval: 10s
      timeout: 5s
      retries: 15
      start_period: 30s

  # 3. MySQL site 3 (chi nhanh 3 - TN03): may chu rieng
  mysql-site3:
    image: mysql:8.0.40
    container_name: office_mysql_site3
    restart: unless-stopped
    command: ["--character-set-server=utf8mb4", "--collation-server=utf8mb4_0900_as_ci"] 
    environment:
      - MYSQL_ROOT_PASSWORD=${MYSQL_ROOT_PASSWORD:?Dat MYSQL_ROOT_PASSWORD trong .env}
    ports:
      - "${SITE3_DB_PORT:-3308}:3306"
    volumes:
      - mysql_site3_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uroot", "-p${MYSQL_ROOT_PASSWORD}", "--silent"]
      interval: 10s
      timeout: 5s
      retries: 15
      start_period: 30s

  # 4. Khoi tao CSDL (chay mot lan): nap trung tam, lap manh cho site 1, 2, 3
  db-init:
    image: mysql:8.0.40
    container_name: office_db_init
    restart: "no"
    depends_on:
      mysql-central:
        condition: service_healthy
      mysql-site2:
        condition: service_healthy
      mysql-site3:
        condition: service_healthy
    environment:
      - MYSQL_ROOT_PASSWORD=${MYSQL_ROOT_PASSWORD:?Dat MYSQL_ROOT_PASSWORD trong .env}
      - MYSQL_CENTRAL_HOST=mysql-central
      - MYSQL_SITE2_HOST=mysql-site2
      - MYSQL_SITE3_HOST=mysql-site3
    volumes:
      - ./docker/init-db.sh:/docker/init-db.sh:ro
      - ./database:/app/database:ro
    entrypoint: ["/bin/bash", "/docker/init-db.sh"]

  # 5. MongoDB phan manh (sharded cluster): keygen -> config server -> 3 shard -> mongos (router).
  #    Moi shard giu mot toa nha (zone): shard1 = TN01 (site 1), shard2 = TN02, shard3 = TN03.
  mongo-keygen:
    image: mongo:7.0
    container_name: office_mongo_keygen
    user: "0:0"
    restart: "no"
    entrypoint: ["/bin/bash", "-c"]
    command: ["openssl rand -base64 756 > /keyfile/keyfile && chown 999:999 /keyfile/keyfile && chmod 400 /keyfile/keyfile && echo keyfile tao xong"]
    volumes:
      - mongo_keyfile:/keyfile

  mongo-config:
    image: mongo:7.0
    container_name: office_mongo_config
    restart: unless-stopped
    entrypoint: ["/bin/bash", "/docker/mongo-node.sh", "config"]
    environment:
      - MONGO_INITDB_ROOT_USERNAME=${MONGO_ROOT_USERNAME:-admin}
      - MONGO_INITDB_ROOT_PASSWORD=${MONGO_ROOT_PASSWORD:?Dat MONGO_ROOT_PASSWORD trong .env}
    volumes:
      - mongo_config_data:/data/db
      - mongo_keyfile:/etc/mongo:ro
      - ./docker/mongo-node.sh:/docker/mongo-node.sh:ro
    depends_on:
      mongo-keygen:
        condition: service_completed_successfully

  mongo-shard1:
    image: mongo:7.0
    container_name: office_mongo_shard1
    restart: unless-stopped
    entrypoint: ["/bin/bash", "/docker/mongo-node.sh", "shard1"]
    environment:
      - MONGO_INITDB_ROOT_USERNAME=${MONGO_ROOT_USERNAME:-admin}
      - MONGO_INITDB_ROOT_PASSWORD=${MONGO_ROOT_PASSWORD:?Dat MONGO_ROOT_PASSWORD trong .env}
    volumes:
      - mongo_shard1_data:/data/db
      - mongo_keyfile:/etc/mongo:ro
      - ./docker/mongo-node.sh:/docker/mongo-node.sh:ro
    depends_on:
      mongo-keygen:
        condition: service_completed_successfully

  mongo-shard2:
    image: mongo:7.0
    container_name: office_mongo_shard2
    restart: unless-stopped
    entrypoint: ["/bin/bash", "/docker/mongo-node.sh", "shard2"]
    environment:
      - MONGO_INITDB_ROOT_USERNAME=${MONGO_ROOT_USERNAME:-admin}
      - MONGO_INITDB_ROOT_PASSWORD=${MONGO_ROOT_PASSWORD:?Dat MONGO_ROOT_PASSWORD trong .env}
    volumes:
      - mongo_shard2_data:/data/db
      - mongo_keyfile:/etc/mongo:ro
      - ./docker/mongo-node.sh:/docker/mongo-node.sh:ro
    depends_on:
      mongo-keygen:
        condition: service_completed_successfully

  mongo-shard3:
    image: mongo:7.0
    container_name: office_mongo_shard3
    restart: unless-stopped
    entrypoint: ["/bin/bash", "/docker/mongo-node.sh", "shard3"]
    environment:
      - MONGO_INITDB_ROOT_USERNAME=${MONGO_ROOT_USERNAME:-admin}
      - MONGO_INITDB_ROOT_PASSWORD=${MONGO_ROOT_PASSWORD:?Dat MONGO_ROOT_PASSWORD trong .env}
    volumes:
      - mongo_shard3_data:/data/db
      - mongo_keyfile:/etc/mongo:ro
      - ./docker/mongo-node.sh:/docker/mongo-node.sh:ro
    depends_on:
      mongo-keygen:
        condition: service_completed_successfully

  # Router: ung dung va Compass ket noi vao day (cong MONGO_PORT, mac dinh 27017).
  mongos:
    image: mongo:7.0
    container_name: office_mongos
    restart: unless-stopped
    entrypoint: ["/bin/bash", "/docker/mongo-node.sh", "mongos"]
    environment:
      - MONGO_INITDB_ROOT_USERNAME=${MONGO_ROOT_USERNAME:-admin}
      - MONGO_INITDB_ROOT_PASSWORD=${MONGO_ROOT_PASSWORD:?Dat MONGO_ROOT_PASSWORD trong .env}
    ports:
      - "${MONGO_PORT:-27017}:27017"
    volumes:
      - mongo_keyfile:/etc/mongo:ro
      - ./docker/mongo-node.sh:/docker/mongo-node.sh:ro
      - ./docker/init-mongo.js:/docker/init-mongo.js:ro
    healthcheck:
      test: ["CMD", "test", "-f", "/tmp/mongo-cluster-ready"]
      interval: 10s
      timeout: 5s
      retries: 60
      start_period: 60s
    depends_on:
      mongo-config:
        condition: service_started
      mongo-shard1:
        condition: service_started
      mongo-shard2:
        condition: service_started
      mongo-shard3:
        condition: service_started
  # 6. Ung dung Web (Node.js 22 + Express + SPA)
  web:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: office_web_app
    restart: unless-stopped
    ports:
      - "${PORT:-3000}:3000"
    depends_on:
      db-init:
        condition: service_completed_successfully
      mongos:
        condition: service_healthy
    environment:
      - PORT=3000
      - HOST=0.0.0.0
      - DATA_MODE=mysql
      - DB_SERVER=mysql-central
      - DB_PORT=3306
      - DB_DATABASE=QLToaNha_BCNF
      - DB_USER=root
      - DB_PASSWORD=${MYSQL_ROOT_PASSWORD:?Dat MYSQL_ROOT_PASSWORD trong .env}
      - TV7_SITE1_SERVER=mysql-central
      - TV7_SITE1_PORT=3306
      - TV7_SITE1_DATABASE=QLToaNha_Site1
      - TV7_SITE2_SERVER=mysql-site2
      - TV7_SITE2_PORT=3306
      - TV7_SITE2_DATABASE=QLToaNha_Site2
      - TV7_SITE3_SERVER=mysql-site3
      - TV7_SITE3_PORT=3306
      - TV7_SITE3_DATABASE=QLToaNha_Site3
      - TV7_MONGO_URI=mongodb://${MONGO_ROOT_USERNAME:-admin}:${MONGO_ROOT_PASSWORD}@mongos:27017/?authSource=admin
      - TV7_MONGO_DATABASE=QuanLyToaNha

volumes:
  mysql_central_data:
    driver: local
  mysql_site2_data:
    driver: local
  mysql_site3_data:
    driver: local
  mongo_keyfile:
    driver: local
  mongo_config_data:
    driver: local
  mongo_shard1_data:
    driver: local
  mongo_shard2_data:
    driver: local
  mongo_shard3_data:
    driver: local
